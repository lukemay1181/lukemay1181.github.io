<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#5c5751">
  <meta name="description" content="OFF SZN Lifting Club. Coming soon.">
  <title>OFF SZN — Lifting Club</title>
  <link rel="preload" href="assets/wall-off.webp" as="image" type="image/webp">
  <link rel="preload" href="assets/wall-on.webp" as="image" type="image/webp">
  <style>
  :root{color-scheme:dark;--ink:#24221f;--wall:#69635b;--off:url('assets/wall-off.webp');--on:url('assets/wall-on.webp')}
  *{box-sizing:border-box}html{height:100%}body{margin:0;min-height:100%;background:#57534d;font-family:Arial,Helvetica,sans-serif;overflow:hidden}
  button,a{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid #ead6af;outline-offset:4px}
  .skip{position:absolute;left:-9999px;top:1rem;padding:10px;background:#252422;color:#fff;z-index:100}.skip:focus{left:1rem}
  .screen{position:relative;width:100%;height:100svh;min-height:400px;isolation:isolate;overflow:hidden}
  .ambient-wall{position:absolute;inset:-35px;z-index:-2;background:var(--off) center/cover;filter:blur(24px) brightness(.66)}
  .desktop-scene{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  .artboard{position:relative;width:min(100vw,calc(100svh * 1843 / 883));aspect-ratio:1843/883;max-height:100svh;background:var(--off) center/100% 100% no-repeat;box-shadow:0 0 65px #18171522;overflow:hidden}
  .light-area,.hover-detail{position:absolute;inset:0;pointer-events:none;background:var(--on) center/100% 100% no-repeat;opacity:0}
  .light-area{transition:opacity .14s ease;mask-image:radial-gradient(ellipse 15.8% 30% at var(--cx) 45%,#000 0%,#000 39%,transparent 100%);-webkit-mask-image:radial-gradient(ellipse 15.8% 30% at var(--cx) 45%,#000 0%,#000 39%,transparent 100%)}
  .hover-detail{transition:opacity .26s ease,transform .55s cubic-bezier(.22,.6,.27,1);mask-image:radial-gradient(ellipse 10.5% 23% at var(--cx) 61%,#000 0%,#000 54%,transparent 98%);-webkit-mask-image:radial-gradient(ellipse 10.5% 23% at var(--cx) 61%,#000 0%,#000 54%,transparent 98%);transform:scale(1);transform-origin:var(--cx) 61%}
  .station.is-lit .light-area{opacity:1}.station.is-lit .hover-detail{opacity:.96;transform:scale(1.035)}
  .station.is-flickering .light-area{animation:single-flicker .74s steps(1,end) both}
  .station.is-flickering .hover-detail{animation:shirt-fade .74s steps(1,end) both}
  @keyframes single-flicker{0%,7%,16%,23%,35%,43%{opacity:0}8%,15%,24%,34%{opacity:1}36%,42%{opacity:.22}44%,100%{opacity:1}}
  @keyframes shirt-fade{0%,43%{opacity:0}44%,100%{opacity:.96}}
  .station{position:absolute;inset:0;pointer-events:none}
  .shirt-trigger{position:absolute;z-index:4;top:40%;width:18%;height:45%;padding:0;border:0;background:transparent;pointer-events:auto;touch-action:manipulation}
  .shirt-trigger[data-index="0"]{left:16.6%}.shirt-trigger[data-index="1"]{left:42.4%}.shirt-trigger[data-index="2"]{left:68.1%}
  .station[data-index="0"]{--cx:25.7%}.station[data-index="1"]{--cx:51.5%}.station[data-index="2"]{--cx:76.9%}
  .menu-toggle{position:absolute;z-index:20;left:3.1%;top:7%;width:4.5%;height:5.3%;min-width:44px;min-height:44px;border:0;background:transparent;padding:0;display:grid;place-content:center;gap:6px;color:#252421}
  .menu-toggle span{display:block;width:28px;height:2px;background:currentColor;box-shadow:0 1px 0 #ffffff16;transition:transform .2s ease,opacity .2s ease}
  /* The reference already has a photographed menu icon. Keep the hit target but don't draw a second icon. */
  .desktop-scene .menu-toggle span{opacity:0}
  .menu-toggle[aria-expanded="true"] span:first-child{transform:translateY(8px) rotate(45deg)}
  .menu-toggle[aria-expanded="true"] span:nth-child(2){opacity:0}
  .menu-toggle[aria-expanded="true"] span:last-child{transform:translateY(-8px) rotate(-45deg)}
  .menu-panel{position:absolute;z-index:21;left:3.2%;top:13.4%;width:min(260px,82vw);padding:13px;background:rgba(34,32,30,.96);color:#f6f2ea;box-shadow:0 18px 40px #0005;border:1px solid #ffffff27;backdrop-filter:blur(10px)}
  .menu-panel[hidden]{display:none}.menu-panel a{display:block;padding:15px 11px;color:inherit;text-decoration:none;text-transform:uppercase;letter-spacing:.17em;font-size:11px;line-height:1.3;border-bottom:1px solid #ffffff23}.menu-panel a:last-child{border:0}.menu-panel a:hover{background:#ffffff12}
  .mobile-view{display:none}
  @media(max-width:700px){
    body{overflow:hidden}.screen{display:flex;flex-direction:column;min-height:560px}
    .desktop-scene{display:none}
    .mobile-view{display:flex;flex:1;flex-direction:column;min-height:0}
    .mobile-header{height:clamp(133px,22svh,198px);flex:0 0 auto;position:relative;z-index:12;background:url('assets/mobile-header.webp') center/100% 100% no-repeat;overflow:visible;isolation:isolate}
    .mobile-header:before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(85,80,74,.08),transparent 45%);z-index:-1}
    .mobile-logo{display:none}
    .mobile-menu{position:absolute;left:14px;top:13px;z-index:25}
    .mobile-menu .menu-toggle{position:static;width:46px;height:46px;min-width:46px;min-height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:#221f1c}
    .mobile-menu .menu-toggle span{width:27px;height:2px}
    .mobile-menu .menu-panel{position:fixed;left:14px;top:68px;min-width:220px;width:60vw}
    .mobile-gallery{display:flex;flex:1;min-height:0;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none;overscroll-behavior-x:contain;touch-action:pan-x}
    .mobile-gallery::-webkit-scrollbar{display:none}
    .mobile-panel{position:relative;flex:0 0 100%;height:100%;min-height:0;scroll-snap-align:center;scroll-snap-stop:always;isolation:isolate;overflow:hidden;background:var(--off) var(--pan) 100% / auto 140% no-repeat}
    .mobile-panel:after{content:"";position:absolute;inset:auto 0 0;height:8%;background:linear-gradient(0deg,#15141233,transparent);pointer-events:none}
    .mobile-lit,.mobile-zoom{position:absolute;inset:0;pointer-events:none;background:var(--on) var(--pan) 100% / auto 140% no-repeat;opacity:0}
    .mobile-lit{transition:opacity .16s ease}.mobile-zoom{mask-image:radial-gradient(ellipse 48% 39% at 50% 55%,#000 0%,#000 52%,transparent 98%);-webkit-mask-image:radial-gradient(ellipse 48% 39% at 50% 55%,#000 0%,#000 52%,transparent 98%);transform-origin:50% 57%;transition:opacity .24s ease,transform .5s ease;transform:scale(1)}
    .mobile-panel.is-lit .mobile-lit{opacity:1}.mobile-panel.is-lit .mobile-zoom{opacity:1;transform:scale(1.023)}
    .mobile-panel.is-flickering .mobile-lit{animation:single-flicker .74s steps(1,end) both}
    .mobile-panel.is-flickering .mobile-zoom{animation:shirt-fade .74s steps(1,end) both}
    .mobile-panel[data-index="0"]{--pan:18.6%}.mobile-panel[data-index="1"]{--pan:52%}.mobile-panel[data-index="2"]{--pan:84.5%}
    .mobile-panel button{position:absolute;inset:0;width:100%;border:0;background:transparent;color:transparent;cursor:default}
    .mobile-controls{height:54px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;gap:28px;background:#645f58;color:#e5ddd0}
    .mobile-arrow{border:0;background:transparent;color:inherit;width:40px;height:44px;font-size:27px;font-weight:200;line-height:1}.mobile-arrow:disabled{opacity:.23}
    .dots{display:flex;align-items:center;justify-content:center;gap:11px;min-width:55px}.dot{width:5px;height:5px;border-radius:50%;background:#eee5d64a}.dot.active{background:#eee5d6;transform:scale(1.35)}
  }
  @media(prefers-reduced-motion:reduce){.station.is-flickering .light-area,.station.is-flickering .hover-detail,.mobile-panel.is-flickering .mobile-lit,.mobile-panel.is-flickering .mobile-zoom{animation:none}.mobile-gallery{scroll-behavior:auto}.hover-detail,.mobile-zoom,.light-area,.mobile-lit{transition:none}}
  </style>
</head>
<body>
<a class="skip" href="#collection">Skip to the collection</a>
<main class="screen" aria-label="OFF SZN Lifting Club teaser collection">
  <div class="ambient-wall" aria-hidden="true"></div>
  <div class="desktop-scene" id="desktop-scene">
    <div class="artboard" id="collection" aria-label="Three OFF SZN coming soon shirts on a concrete wall">
      <div class="station" data-index="0"><div class="light-area" aria-hidden="true"></div><div class="hover-detail" aria-hidden="true"></div><button class="shirt-trigger" data-index="0" aria-label="Preview shirt 001" type="button"></button></div>
      <div class="station" data-index="1"><div class="light-area" aria-hidden="true"></div><div class="hover-detail" aria-hidden="true"></div><button class="shirt-trigger" data-index="1" aria-label="Preview shirt 002" type="button"></button></div>
      <div class="station" data-index="2"><div class="light-area" aria-hidden="true"></div><div class="hover-detail" aria-hidden="true"></div><button class="shirt-trigger" data-index="2" aria-label="Preview shirt 003" type="button"></button></div>
      <div class="desktop-menu">
        <button class="menu-toggle" type="button" aria-controls="desktop-menu-panel" aria-expanded="false" aria-label="Open menu"><span></span><span></span><span></span></button>
        <nav class="menu-panel" id="desktop-menu-panel" aria-label="Site links" hidden><a href="#collection">Collection</a><a href="https://www.instagram.com/offszn_apparel/" rel="noopener noreferrer" target="_blank">Instagram ↗</a><a href="mailto:contact.offsznapparel@gmail.com">Contact ↗</a></nav>
      </div>
    </div>
  </div>
  <div class="mobile-view">
    <header class="mobile-header">
      <div class="mobile-menu">
        <button class="menu-toggle" type="button" aria-controls="mobile-menu-panel" aria-expanded="false" aria-label="Open menu"><span></span><span></span><span></span></button>
        <nav class="menu-panel" id="mobile-menu-panel" aria-label="Site links" hidden><a href="#mobile-collection">Collection</a><a href="https://www.instagram.com/offszn_apparel/" rel="noopener noreferrer" target="_blank">Instagram ↗</a><a href="mailto:contact.offsznapparel@gmail.com">Contact ↗</a></nav>
      </div>
    </header>
    <div class="mobile-gallery" id="mobile-collection" tabindex="0" aria-label="Swipe to see three shirts" role="region">
      <section class="mobile-panel" data-index="0" aria-label="Shirt 001"><div class="mobile-lit"></div><div class="mobile-zoom"></div><button type="button" aria-label="Shirt 001, coming soon"></button></section>
      <section class="mobile-panel" data-index="1" aria-label="Shirt 002"><div class="mobile-lit"></div><div class="mobile-zoom"></div><button type="button" aria-label="Shirt 002, coming soon"></button></section>
      <section class="mobile-panel" data-index="2" aria-label="Shirt 003"><div class="mobile-lit"></div><div class="mobile-zoom"></div><button type="button" aria-label="Shirt 003, coming soon"></button></section>
    </div>
    <nav class="mobile-controls" aria-label="Shirt carousel controls"><button class="mobile-arrow" id="prev" type="button" aria-label="Previous shirt">‹</button><div class="dots" aria-live="polite" aria-label="Shirt 1 of 3"><span class="dot active"></span><span class="dot"></span><span class="dot"></span></div><button class="mobile-arrow" id="next" type="button" aria-label="Next shirt">›</button></nav>
  </div>
</main>
<script>
(() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)');
  const mobileMedia = matchMedia('(max-width: 700px)');
  const menuNodes = [...document.querySelectorAll('.desktop-menu,.mobile-menu')];
  const setMenu = (node,show) => {
    const button = node.querySelector('.menu-toggle');
    const panel = node.querySelector('.menu-panel');
    panel.hidden = !show;
    button.setAttribute('aria-expanded',String(show));
    button.setAttribute('aria-label',show?'Close menu':'Open menu');
  };
  menuNodes.forEach(node => {
    node.querySelector('.menu-toggle').addEventListener('click',() => {
      const opening=node.querySelector('.menu-panel').hidden;
      menuNodes.forEach(n=>setMenu(n,false));
      setMenu(node,opening);
    });
    node.querySelectorAll('.menu-panel a').forEach(a=>a.addEventListener('click',()=>setMenu(node,false)));
  });
  document.addEventListener('pointerdown',event=>{if(!event.target.closest('.desktop-menu,.mobile-menu'))menuNodes.forEach(n=>setMenu(n,false))});
  document.addEventListener('keydown',event=>{if(event.key==='Escape')menuNodes.forEach(n=>{if(!n.querySelector('.menu-panel').hidden){setMenu(n,false);n.querySelector('.menu-toggle').focus()}})});

  const stations=[...document.querySelectorAll('.desktop-scene .station')];
  const panels=[...document.querySelectorAll('.mobile-panel')];
  const timers=new WeakMap();
  let activeDesktop=-1,activeMobile=-1;
  function offAll(elements){
    elements.forEach(el=>{clearTimeout(timers.get(el));el.classList.remove('is-lit','is-flickering')});
  }
  function turnOn(el){
    el.classList.add('is-lit');
    if(reduce.matches)return;
    void el.offsetWidth;
    el.classList.add('is-flickering');
    timers.set(el,setTimeout(()=>el.classList.remove('is-flickering'),780));
  }
  function desktopActivate(index){
    if(mobileMedia.matches||activeDesktop===index)return;
    offAll(stations);activeDesktop=index;
    if(index>=0)turnOn(stations[index]);
  }
  stations.forEach((station,index)=>{
    const trigger=station.querySelector('button');
    trigger.addEventListener('pointerenter',event=>{if(event.pointerType!=='touch')desktopActivate(index)});
    trigger.addEventListener('pointerleave',event=>{if(event.pointerType!=='touch')desktopActivate(-1)});
    trigger.addEventListener('focus',()=>desktopActivate(index));
    trigger.addEventListener('blur',()=>desktopActivate(-1));
    trigger.addEventListener('click',()=>desktopActivate(index));
  });
  const gallery=document.getElementById('mobile-collection');
  const prev=document.getElementById('prev'),next=document.getElementById('next');
  const dots=[...document.querySelectorAll('.dot')];
  const dotsRegion=document.querySelector('.dots');
  let scrollTimer;
  const currentPanel=()=>{
    const center=gallery.getBoundingClientRect().left+gallery.clientWidth/2;
    let winner=0,best=Infinity;
    panels.forEach((el,i)=>{const r=el.getBoundingClientRect();const d=Math.abs(r.left+r.width/2-center);if(d<best){best=d;winner=i}});
    return winner;
  };
  function mobileActivate(index){
    if(activeMobile!==index){offAll(panels);activeMobile=index;turnOn(panels[index])}
    dots.forEach((el,i)=>el.classList.toggle('active',i===index));
    dotsRegion.setAttribute('aria-label',`Shirt ${index+1} of 3`);
    prev.disabled=index===0;next.disabled=index===panels.length-1;
  }
  function go(index){
    if(index<0||index>=panels.length)return;
    gallery.scrollTo({left:panels[index].offsetLeft-panels[0].offsetLeft,behavior:reduce.matches?'instant':'smooth'});
    mobileActivate(index);
  }
  gallery.addEventListener('scroll',()=>{clearTimeout(scrollTimer);scrollTimer=setTimeout(()=>mobileActivate(currentPanel()),110)},{passive:true});
  gallery.addEventListener('scrollend',()=>mobileActivate(currentPanel()));
  gallery.addEventListener('keydown',event=>{
    if(event.key==='ArrowLeft'||event.key==='ArrowRight'){
      event.preventDefault();go(Math.max(0,Math.min(2,currentPanel()+(event.key==='ArrowRight'?1:-1))))
    }
  });
  prev.addEventListener('click',()=>go(currentPanel()-1));
  next.addEventListener('click',()=>go(currentPanel()+1));
  mobileMedia.addEventListener('change',()=>{
    if(mobileMedia.matches){activeDesktop=-1;offAll(stations);gallery.scrollLeft=0;activeMobile=-1;mobileActivate(0)}
    else{activeMobile=-1;offAll(panels);activeDesktop=-1;offAll(stations)}
    menuNodes.forEach(n=>setMenu(n,false));
  });
  mobileActivate(0);
})();
</script>
</body>
</html>
