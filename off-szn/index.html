<title>OFF SZN — Lifting Club</title>
<style>
:root { --wall:#898782; --chalk:#f4f2ec; --charcoal:#1f1e1b; --ash:#bdbab2; --line:rgba(35,33,30,.28); color-scheme:light; }
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0; background:#797772; color:var(--charcoal);font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,a{font:inherit}button{cursor:pointer}a{color:inherit}
button:focus-visible,a:focus-visible{outline:2px solid #f5e2aa;outline-offset:5px}
.skip{position:fixed;left:12px;top:-80px;z-index:100;background:white;padding:10px 16px}.skip:focus{top:12px}
.site{min-height:100svh;display:flex;flex-direction:column}
/* The quiet, thin showroom header is deliberately separate from the wall. */
.site-header{height:80px; flex:0 0 auto;position:relative;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:0 clamp(18px,3.3vw,56px);border-bottom:1px solid rgba(243,241,235,.25);background:#55534e;color:#f1eee7}
.brand{display:inline-flex;flex-direction:column;gap:3px;line-height:1;text-decoration:none;flex-shrink:0;min-width:0}
.brand-name{font-family:Georgia,'Times New Roman',serif;font-size:clamp(26px,2.65vw,38px);letter-spacing:-.055em;white-space:nowrap;line-height:.95;font-weight:400}
.brand-name .brand-star{display:inline-block;font-size:.65em;vertical-align:.18em;margin-right:-.07em}
.brand-sub{font-size:8px;letter-spacing:.31em;margin-left:2px;font-weight:600}
.header-right{display:flex;align-items:center;justify-content:flex-end;gap:clamp(14px,3vw,43px);min-width:0}
.header-status{font-size:10px;font-weight:600;letter-spacing:.18em;white-space:nowrap;text-transform:uppercase}
.header-status:before{content:'';display:inline-block;width:5px;height:5px;margin-right:9px;border-radius:50%;background:#efede8;vertical-align:2px}
.header-link{text-decoration:none;font-size:10px;text-transform:uppercase;white-space:nowrap;letter-spacing:.16em;border-bottom:1px solid rgba(255,255,255,.7);padding-bottom:5px}
.header-link:hover{opacity:.65}
main{flex:1;display:flex;flex-direction:column}
/* Concrete gets its own tactile surface; no promotional banners or giant text obscures the clothes. */
.wall{position:relative;isolation:isolate;flex:1;display:flex;flex-direction:column;min-height:clamp(580px,calc(100svh - 148px),870px);overflow:hidden;background:linear-gradient(90deg,#777570,#928f89 48%,#76736d)}
.wall:before{content:'';position:absolute;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(ellipse 45% 65% at 15% 51%,rgba(243,242,232,.13),transparent 80%),
 radial-gradient(ellipse 48% 75% at 84% 48%,rgba(0,0,0,.11),transparent 88%),
 linear-gradient(180deg,rgba(255,255,255,.06),transparent 22%,transparent 84%,rgba(30,28,25,.15)),
 repeating-linear-gradient(0deg,transparent 0 224px,rgba(25,25,25,.13) 225px,rgba(255,255,255,.08) 226px,transparent 228px),
 url("data:image/svg+xml,%3Csvg viewBox='0 0 240 240' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.32' numOctaves='4' seed='8' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='240' height='240' filter='url(%23noise)' opacity='.24'/%3E%3C/svg%3E"); background-size:auto,auto,auto,auto,240px 240px;mix-blend-mode:multiply;opacity:.82}
.wall:after{content:'';position:absolute;inset:0;z-index:6;pointer-events:none;box-shadow:inset 0 55px 65px -55px #1d1b18,inset 0 -90px 90px -85px #1d1b18}
.wall-top{position:relative;z-index:7;display:flex;align-items:center;justify-content:space-between;gap:15px;padding:20px clamp(18px,3.3vw,56px) 0;color:#f2eee6;pointer-events:none}
.wall-top span{font-size:9px;letter-spacing:.20em;text-transform:uppercase;font-weight:600;line-height:1.7;text-shadow:0 1px 8px rgba(0,0,0,.35)}
.wall-top span:last-child{text-align:right}
.gallery{flex:1;position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(4px,1.7vw,32px);padding:0 clamp(10px,3vw,54px);min-height:530px}
.station{position:relative;isolation:isolate;min-width:0;min-height:530px}
.station:before{content:'';position:absolute;top:28px;bottom:50px;left:50%;width:1px;background:rgba(0,0,0,.02);transform:translateX(-50%);pointer-events:none}
/* Steel fixtures start off, then light their own shirt on hover / slide selection. */
.fixture{position:absolute;z-index:4;top:16px;left:50%;width:112px;height:93px;transform:translateX(-50%);pointer-events:none}
.fixture-wire{position:absolute;top:0;left:50%;height:35px;width:3px;transform:translateX(-50%);background:linear-gradient(90deg,#2b2927,#6e6b64,#232321)}
.fixture-shade{position:absolute;top:30px;left:50%;height:25px;width:87px;transform:translateX(-50%);border-radius:11px 11px 18px 18px;background:linear-gradient(90deg,#252523,#77736c 23%,#373530 60%,#171715);box-shadow:0 5px 9px #22222240;border-bottom:3px solid #282723}
.fixture-bulb{position:absolute;top:50px;left:50%;height:8px;width:32px;transform:translateX(-50%);border-radius:0 0 50% 50%;background:#2c2b27;box-shadow:none;transition:background .12s,box-shadow .12s}
.fixture-glow{position:absolute;top:40px;left:50%;width:170px;height:118px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse at 50% 12%,rgba(255,232,176,.44),rgba(249,220,160,.09) 55%,transparent 73%);opacity:0;transition:opacity .15s}
.light-beam{position:absolute;top:70px;left:50%;width:min(129%,440px);height:calc(100% - 142px);transform:translateX(-50%);z-index:-1;pointer-events:none;clip-path:polygon(48% 0,52% 0,100% 100%,0 100%);background:linear-gradient(180deg,rgba(255,242,189,.39),rgba(255,230,167,.19) 55%,rgba(255,232,193,.025));mix-blend-mode:screen;opacity:0;transition:opacity .15s}
.station.is-lit .fixture-bulb{background:#fff1c6;box-shadow:0 0 9px 4px rgba(255,232,179,.78),0 0 24px 13px rgba(255,225,156,.3)}
.station.is-lit .fixture-glow{opacity:1}
.station.is-lit .light-beam{opacity:1}
/* The zoom applies ONLY to the shirt, not the wall or its lamp. */
.shirt-button{position:absolute;top:clamp(147px,16vh,195px);left:50%;transform:translateX(-50%);width:min(95%,clamp(185px,20vw,305px));appearance:none;border:0;background:transparent;padding:0;z-index:3;cursor:pointer;filter:drop-shadow(10px 23px 13px rgba(0,0,0,.33)) brightness(.83);transition:transform .42s cubic-bezier(.2,.8,.2,1),filter .42s ease;transform-origin:50% 35%}
.shirt-svg{display:block;width:100%;height:auto}
.station.is-lit .shirt-button{transform:translateX(-50%) translateY(-7px) scale(1.065);filter:drop-shadow(14px 31px 20px rgba(0,0,0,.43)) brightness(1.08)}
.shirt-button:focus-visible{outline-offset:8px}
.station-label{position:absolute;z-index:5;left:9%;right:9%;bottom:45px;display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:9px;line-height:1.5;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:#f3efe7;text-shadow:0 1px 10px rgba(0,0,0,.45);border-top:1px solid rgba(246,244,234,.37);padding-top:12px;pointer-events:none}
.station-label span:last-child{opacity:.75;font-weight:400;text-align:right}
/* A single flicker animation plays at activation, then ends while the steady light stays on. */
.station.is-flickering .light-beam,.station.is-flickering .fixture-glow{animation:lamp-flicker .76s steps(1,end) both}
.station.is-flickering .fixture-bulb{animation:bulb-flicker .76s steps(1,end) both}
@keyframes lamp-flicker {0%,7%{opacity:0}8%,15%{opacity:1}16%,23%{opacity:0}24%,36%{opacity:1}37%,44%{opacity:.14}45%,58%{opacity:1}59%,64%{opacity:.35}65%,100%{opacity:1}}
@keyframes bulb-flicker{0%,7%,16%,23%,37%,44%,59%,64%{background:#2c2b27;box-shadow:none}8%,15%,24%,36%,45%,58%,65%,100%{background:#fff1c6;box-shadow:0 0 9px 4px rgba(255,232,179,.78),0 0 24px 13px rgba(255,225,156,.3)}}
.gallery-controls{display:none}
/* All informational text sits in its own strips. None overlaps the shirts. */
.bottom-meta{position:relative;z-index:8;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:16px clamp(18px,3.3vw,56px);background:#77746e;border-top:1px solid rgba(255,255,255,.22);color:#f0ede5;font-size:9px;letter-spacing:.15em;line-height:1.6;text-transform:uppercase}
.bottom-meta span:last-child{text-align:right}
.footer{min-height:67px;padding:18px clamp(18px,3.3vw,56px);display:flex;align-items:center;justify-content:space-between;gap:18px;background:#f2f0e9;color:#474640;font-size:9px;letter-spacing:.15em;text-transform:uppercase;line-height:1.65}
.footer a{text-decoration:none;border-bottom:1px solid rgba(71,70,64,.5)}
/* Keep the gallery a single row until it becomes a one-at-a-time swipe carousel. */
@media (max-width:850px) and (min-width:681px){.gallery{gap:0;padding:0 10px}.shirt-button{top:160px;width:min(98%,220px)}.station-label{left:7%;right:7%;font-size:8px}.wall-top span{font-size:8px}}
@media (max-width:680px){
 .site-header{height:71px;padding:0 18px;gap:8px}.brand-name{font-size:31px}.brand-sub{font-size:7px}.header-right{gap:14px}.header-status{display:none}.header-link{font-size:9px;letter-spacing:.1em}

 .gallery::-webkit-scrollbar{display:none}
 .station{flex:0 0 100%;width:100%;height:auto;min-height:510px;scroll-snap-align:center;scroll-snap-stop:always}
 .fixture{top:22px}.light-beam{top:80px;height:calc(100% - 132px);width:min(125vw,430px)}
 .shirt-button{top:clamp(115px,21vh,179px);width:min(77vw,335px);max-width:335px}
 .station-label{left:21px;right:21px;bottom:29px;font-size:10px}
 .gallery-controls{position:relative;z-index:9;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 20px 14px;color:#f2efe8}
 .arrow{width:44px;height:40px;display:grid;place-items:center;background:rgba(50,48,45,.15);border:1px solid rgba(255,255,255,.5);border-radius:0;color:#f1ede7;font-size:22px;line-height:1}
 .arrow:disabled{opacity:.3;cursor:default}
 .slide-indicator{display:flex;align-items:center;gap:12px;font-size:10px;letter-spacing:.20em;font-variant-numeric:tabular-nums}
 .slide-dots{display:flex;align-items:center;gap:6px}
 .slide-dots span{display:block;width:4px;height:4px;border-radius:50%;background:rgba(246,244,236,.38);transition:transform .18s,background .18s}
 .slide-dots span.current{background:#f6f3e9;transform:scale(1.45)}
 .bottom-meta{padding:12px 20px;gap:8px;font-size:8px;letter-spacing:.1em}.bottom-meta span:last-child{display:none}
 .footer{min-height:61px;padding:18px 20px;gap:14px;font-size:8px;letter-spacing:.1em}.footer-center{display:none}
}
@media (min-width:480px) and (max-width:680px){.gallery,.station{min-height:580px}.shirt-button{top:105px;width:min(58vw,285px)}}
@media(max-width:359px){.header-link{font-size:8px}.brand-name{font-size:27px}.shirt-button{width:min(79vw,295px);top:140px}.wall-top span{font-size:7.5px}.station-label{font-size:9px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.gallery{scroll-behavior:auto}.station.is-flickering .light-beam,.station.is-flickering .fixture-glow,.station.is-flickering .fixture-bulb{animation:none}.shirt-button,.light-beam,.fixture-glow,.fixture-bulb{transition:none}}
</style>

</div>
<script>
(() => {
  const gallery = document.getElementById('gallery');
  const stations = [...gallery.querySelectorAll('.station')];
  const mobile = matchMedia('(max-width: 680px)');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  const prev = document.getElementById('prev');
  const next = document.getElementById('next');
  const counter = document.getElementById('counter');
  const dots = [...document.querySelectorAll('.slide-dots span')];
  let current = -1;
  let settleTimer;
  const timers = new WeakMap();
  document.getElementById('year').textContent = new Date().getFullYear();
  function deactivate() {
    stations.forEach(el => {
      el.classList.remove('is-lit','is-flickering');
      clearTimeout(timers.get(el));
      el.querySelector('.shirt-button').setAttribute('aria-pressed','false');
    });
    current = -1;
  }
  function activate(i) {
    if (i < 0 || i >= stations.length || i === current) return;
    deactivate();
    const el = stations[i];
    current = i;
    el.classList.add('is-lit');
    el.querySelector('.shirt-button').setAttribute('aria-pressed','true');
    if (!reduced.matches) {
      void el.offsetWidth;
      el.classList.add('is-flickering');
      timers.set(el, setTimeout(() => { el.classList.remove('is-flickering'); }, 800));
    }
  }
  function centeredIndex() {
    const middle = gallery.getBoundingClientRect().left + gallery.clientWidth / 2;
    let best = 0, distance = Infinity;
    stations.forEach((el,i) => {
      const rect = el.getBoundingClientRect();
      const d = Math.abs(rect.left + rect.width/2 - middle);
      if (d < distance) { best = i; distance = d; }
    });
    return best;
  }
  function updateControls(i) {
    counter.textContent = String(i+1).padStart(2,'0') + ' / 03';
    dots.forEach((el,k) => el.classList.toggle('current', k===i));
    prev.disabled = i===0;
    next.disabled = i===stations.length-1;
  }
  function syncMobile() {
    if(!mobile.matches) return;
    const i=centeredIndex();
    activate(i);
    updateControls(i);
  }
  function goTo(i) {
    if(i<0 || i>=stations.length || !mobile.matches) return;
    gallery.scrollTo({left:i*gallery.clientWidth,behavior:reduced.matches?'instant':'smooth'});
    activate(i);
    updateControls(i);
  }
  stations.forEach((el,i) => {
    const shirt = el.querySelector('.shirt-button');
    shirt.addEventListener('pointerenter',e => {if(!mobile.matches && e.pointerType!=='touch') activate(i);});
    shirt.addEventListener('pointerleave',e => {if(!mobile.matches && e.pointerType!=='touch') deactivate();});
    el.addEventListener('focusin',() => {if(!mobile.matches) activate(i);});
    el.addEventListener('focusout',e=> {if(!mobile.matches && !el.contains(e.relatedTarget))deactivate();});
    shirt.addEventListener('click',()=> {if(mobile.matches)goTo(i);});
  });
  gallery.addEventListener('scroll',()=>{
    if(!mobile.matches)return;
    clearTimeout(settleTimer);
    settleTimer=setTimeout(syncMobile,95);
  },{passive:true});
  gallery.addEventListener('scrollend',syncMobile);
  gallery.addEventListener('keydown',e=>{
    if(!mobile.matches)return;
    if(e.key==='ArrowRight'||e.key==='ArrowLeft'){
      e.preventDefault();goTo(Math.max(0,Math.min(stations.length-1,centeredIndex()+(e.key==='ArrowRight'?1:-1))));
    }
  });
  prev.addEventListener('click',()=>goTo(centeredIndex()-1));
  next.addEventListener('click',()=>goTo(centeredIndex()+1));
  mobile.addEventListener('change',()=>{deactivate();if(mobile.matches){gallery.scrollTo({left:0,behavior:'instant'});activate(0);updateControls(0)}});
  if(mobile.matches){activate(0);updateControls(0)}else{deactivate()}
})();
</script>
